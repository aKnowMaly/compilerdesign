<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <style>
    .box { fill:#eef4ff; stroke:#4169a8; stroke-width:2; rx:12; }
    .reject { fill:#fff3e6; stroke:#b36b00; stroke-width:2; rx:12; }
    .text { font-family:Arial, sans-serif; font-size:18px; fill:#1f2937; text-anchor:middle; }
    .small { font-family:Arial, sans-serif; font-size:14px; fill:#4b5563; text-anchor:middle; }
    .arrow { stroke:#334155; stroke-width:2.5; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="20" y="55" width="135" height="80" class="box"/>
  <text x="87" y="88" class="text">Discover</text>
  <text x="87" y="112" class="small">allocas/globals</text>
  <line x1="155" y1="95" x2="205" y2="95" class="arrow"/>
  <rect x="205" y="55" width="145" height="80" class="box"/>
  <text x="277" y="86" class="text">Validate Uses</text>
  <text x="277" y="112" class="small">GEP/load/store only</text>
  <line x1="350" y1="95" x2="400" y2="95" class="arrow"/>
  <rect x="400" y="55" width="150" height="80" class="box"/>
  <text x="475" y="86" class="text">Infer Width</text>
  <text x="475" y="112" class="small">bits + zext/sext</text>
  <line x1="550" y1="95" x2="600" y2="95" class="arrow"/>
  <rect x="600" y="55" width="125" height="80" class="box"/>
  <text x="662" y="86" class="text">Rewrite IR</text>
  <text x="662" y="112" class="small">narrow memory</text>
  <line x1="725" y1="95" x2="775" y2="95" class="arrow"/>
  <rect x="775" y="55" width="105" height="80" class="box"/>
  <text x="827" y="86" class="text">Verify</text>
  <text x="827" y="112" class="small">LLVM IR</text>
  <rect x="265" y="165" width="370" height="48" class="reject"/>
  <text x="450" y="195" class="text">Unsupported, unknown, or non-reducing candidates are logged and left unchanged</text>
</svg>
